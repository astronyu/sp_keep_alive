name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    - cron: '0 0 * * 2,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add a unique identifier suffix for each database here
        id: [1, 2] 
    steps:
      - name: Ping Supabase REST API
        run: |
          # Dynamically fetch the numbered secrets based on the matrix ID
          URL_SECRET="SUPABASE_URL_${{ matrix.id }}"
          KEY_SECRET="SUPABASE_ANON_KEY_${{ matrix.id }}"
          
          URL="${!URL_SECRET}"
          KEY="${!KEY_SECRET}"

          curl -i -X GET "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}"
