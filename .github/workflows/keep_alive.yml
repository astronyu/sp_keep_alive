name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    # Run 3 times daily to maintain sufficient database activity on Supabase Free projects.
    # 00:00, 08:00 and 16:00 UTC = 08:00, 16:00 and 00:00 MYT.
    - cron: "0 0,8,16 * * *"

  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Project ${{ matrix.id }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        id: [1, 2]

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.id)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_ANON_KEY_{0}', matrix.id)] }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL_${{ matrix.id }} is missing or unavailable."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY_${{ matrix.id }} is missing or unavailable."
            exit 1
          fi

          echo "Pinging Supabase project ${{ matrix.id }}..."

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 15 \
            --max-time 30 \
            --request GET \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}"

          echo
          echo "Supabase project ${{ matrix.id }} pinged successfully."
